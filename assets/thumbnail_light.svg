<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <!-- Light Mode Pearl / Studio Background -->
    <linearGradient id="lightBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#edf2f7" />
    </linearGradient>

    <!-- Warm Ambient Vitality Glow -->
    <radialGradient id="vitalityGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="40%" stop-color="#10b981" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>

    <!-- Frosted Glass Facet Gradients (Light Aesthetic) -->
    <linearGradient id="glassFacet1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#e2e8f0" stop-opacity="0.4" />
    </linearGradient>

    <linearGradient id="glassFacet2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#bae6fd" stop-opacity="0.3" />
    </linearGradient>

    <linearGradient id="glassFacet3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d1fae5" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#a7f3d0" stop-opacity="0.3" />
    </linearGradient>

    <linearGradient id="glassFacet4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ede9fe" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ddd6fe" stop-opacity="0.3" />
    </linearGradient>

    <!-- Iridescent Accent Gradients -->
    <linearGradient id="iridescentRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="35%" stop-color="#059669" />
      <stop offset="70%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Soft Studio Shadow -->
    <filter id="studioShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="32" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>

    <filter id="softGlowLight" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Clean Studio Canvas -->
  <rect width="1200" height="800" fill="url(#lightBg)" />

  <!-- Soft Ambient Light Pools -->
  <circle cx="600" cy="380" r="380" fill="url(#vitalityGlow)" />
  <circle cx="350" cy="300" r="240" fill="#38bdf8" fill-opacity="0.06" />
  <circle cx="850" cy="420" r="260" fill="#8b5cf6" fill-opacity="0.05" />

  <!-- Ultra-Subtle Architectural Guidance Lines -->
  <g opacity="0.12" stroke="#64748b" stroke-width="1">
    <circle cx="600" cy="370" r="460" fill="none" stroke-dasharray="2 6" />
    <circle cx="600" cy="370" r="320" fill="none" stroke-dasharray="4 8" />
    <circle cx="600" cy="370" r="190" fill="none" />
  </g>

  <!-- Delicate Multi-Agent Synaptic Orbit (Harmonic Resonance Rings) -->
  <g fill="none" stroke-width="1.5">
    <ellipse cx="600" cy="370" rx="350" ry="180" stroke="url(#iridescentRing)" stroke-opacity="0.35" stroke-dasharray="6 8" transform="rotate(-15 600 370)" />
    <ellipse cx="600" cy="370" rx="350" ry="180" stroke="#0ea5e9" stroke-opacity="0.25" stroke-dasharray="4 6" transform="rotate(25 600 370)" />
  </g>

  <!-- Data Filaments Connecting Agents to Core -->
  <g stroke-width="1.5" stroke-opacity="0.4">
    <line x1="600" y1="370" x2="340" y2="240" stroke="#059669" stroke-dasharray="4 4" />
    <line x1="600" y1="370" x2="860" y2="240" stroke="#7c3aed" stroke-dasharray="4 4" />
    <line x1="600" y1="370" x2="600" y2="580" stroke="#0284c7" stroke-dasharray="4 4" />
  </g>

  <!-- Central Crystalline Prism Structure (Abstract Privacy Vault & Core) -->
  <g transform="translate(600, 370)" filter="url(#studioShadow)">
    <!-- Base Shadow Grounding -->
    <ellipse cx="0" cy="150" rx="140" ry="24" fill="#0f172a" fill-opacity="0.06" filter="url(#softGlowLight)" />

    <!-- Outer Faceted Geometric Prism -->
    <polygon points="0,-125 105,-35 85,95 0,140 -85,95 -105,-35"
             fill="#ffffff" fill-opacity="0.75" stroke="#94a3b8" stroke-width="1.2" stroke-opacity="0.4" />

    <!-- Glass Facet Shards with Refraction -->
    <polygon points="0,-125 -105,-35 0,0" fill="url(#glassFacet2)" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5" />
    <polygon points="0,-125 105,-35 0,0" fill="url(#glassFacet4)" stroke="#818cf8" stroke-width="1" stroke-opacity="0.5" />
    <polygon points="-105,-35 -85,95 0,140 0,0" fill="url(#glassFacet3)" stroke="#34d399" stroke-width="1" stroke-opacity="0.5" />
    <polygon points="105,-35 85,95 0,140 0,0" fill="url(#glassFacet1)" stroke="#cbd5e1" stroke-width="1" stroke-opacity="0.6" />

    <!-- Inner Floating Luminous Seed (The Protected Vital Health Core) -->
    <circle cx="0" cy="0" r="22" fill="#0284c7" fill-opacity="0.1" />
    <circle cx="0" cy="0" r="14" fill="#0ea5e9" />
    <circle cx="0" cy="0" r="6" fill="#ffffff" />
    <circle cx="0" cy="0" r="32" fill="none" stroke="#059669" stroke-width="1.5" stroke-dasharray="4 4" stroke-opacity="0.6" />
  </g>

  <!-- Agent Node 1: Molecular / Genomic Intelligence (Top-Left) -->
  <g transform="translate(340, 240)" filter="url(#studioShadow)">
    <circle cx="0" cy="0" r="44" fill="#ffffff" stroke="#10b981" stroke-width="2" />
    <!-- Abstract Bio-Curve -->
    <circle cx="0" cy="0" r="24" fill="#ecfdf5" />
    <path d="M-12,-8 C-6,-18 6,-18 12,-8 C18,2 6,14 0,16 C-6,14 -18,2 -12,-8 Z"
          fill="none" stroke="#059669" stroke-width="2" />
    <circle cx="0" cy="0" r="3.5" fill="#10b981" />
    <text x="0" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
          font-size="13" font-weight="700" fill="#065f46" text-anchor="middle" letter-spacing="1">GENOMICS NODE</text>
    <text x="0" y="82" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
          font-size="11" fill="#047857" text-anchor="middle" opacity="0.8">Molecular Evidence</text>
  </g>

  <!-- Agent Node 2: Pharmacological Intelligence (Top-Right) -->
  <g transform="translate(860, 240)" filter="url(#studioShadow)">
    <circle cx="0" cy="0" r="44" fill="#ffffff" stroke="#8b5cf6" stroke-width="2" />
    <!-- Abstract Molecular Hexagon -->
    <circle cx="0" cy="0" r="24" fill="#f5f3ff" />
    <polygon points="0,-14 12,-7 12,7 0,14 -12,7 -12,-7"
             fill="none" stroke="#7c3aed" stroke-width="2" />
    <circle cx="0" cy="0" r="3.5" fill="#8b5cf6" />
    <text x="0" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
          font-size="13" font-weight="700" fill="#5b21b6" text-anchor="middle" letter-spacing="1">PHARMA NODE</text>
    <text x="0" y="82" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
          font-size="11" fill="#6d28d9" text-anchor="middle" opacity="0.8">Interaction Analysis</text>
  </g>

  <!-- Agent Node 3: Clinical Protocol Intelligence (Bottom) -->
  <g transform="translate(600, 580)" filter="url(#studioShadow)">
    <circle cx="0" cy="0" r="44" fill="#ffffff" stroke="#0ea5e9" stroke-width="2" />
    <!-- Abstract Horizon / Cross-Referencing Ring -->
    <circle cx="0" cy="0" r="24" fill="#f0f9ff" />
    <circle cx="0" cy="0" r="14" fill="none" stroke="#0284c7" stroke-width="2" />
    <line x1="-14" y1="0" x2="14" y2="0" stroke="#0284c7" stroke-width="2" />
    <line x1="0" y1="-14" x2="0" y2="14" stroke="#0284c7" stroke-width="2" />
    <circle cx="0" cy="0" r="3.5" fill="#0ea5e9" />
    <text x="0" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
          font-size="13" font-weight="700" fill="#075985" text-anchor="middle" letter-spacing="1">TRIALS NODE</text>
    <text x="0" y="82" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
          font-size="11" fill="#0369a1" text-anchor="middle" opacity="0.8">Protocol Validation</text>
  </g>

  <!-- Top Editorial Tag -->
  <g transform="translate(600, 72)">
    <rect x="-180" y="-16" width="360" height="32" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" filter="url(#studioShadow)" />
    <circle cx="-150" cy="0" r="4" fill="#0284c7" />
    <text x="-135" y="4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
          font-size="11.5" font-weight="700" fill="#475569" letter-spacing="2">OPEN AGENTIC WEB CHALLENGE</text>
  </g>

  <!-- Bottom Crisp Editorial Typography -->
  <g transform="translate(600, 725)">
    <text x="0" y="-12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
          font-size="38" font-weight="900" fill="#0f172a" text-anchor="middle" letter-spacing="4">
      AEGIS <tspan fill="#0284c7">CONSENSUS</tspan>
    </text>
    <text x="0" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
          font-size="14" font-weight="600" fill="#64748b" text-anchor="middle" letter-spacing="2">
      DECENTRALIZED MULTI-SPECIALIST CLINICAL INTELLIGENCE
    </text>
  </g>

  <!-- Badges -->
  <g transform="translate(70, 745)" opacity="0.9">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#0f766e">
      🔒 100% Client-Side In-Browser Execution
    </text>
  </g>
  <g transform="translate(930, 745)" opacity="0.9">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#6d28d9">
      ⚡ Powered by Mozilla Otari BYOK
    </text>
  </g>
</svg>
